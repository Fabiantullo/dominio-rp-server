## FiveM Documentation
## https://aka.cfx.re/server-commands

## QBCore Documentation
## https://docs.qbcore.org

## IMPORTANTE: Este archivo utiliza variables de entorno desde .env
## Las credenciales sensibles están en .env (ignorado en .gitignore)
## Para producción: copiar .env.example a .env y llenar con valores reales

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 10

## ==================
## VARIABLES DE ENTORNO (.env)
## ==================
sv_licenseKey "${FIVEM_LICENSE_KEY}"
sv_hostname "${FIVEM_HOST_NAME}"
sets sv_projectName "[QBCore] Dominio"
sets sv_projectDesc "${FIVEM_SERVER_DESCRIPTION}"
sets locale "${LOCALE}"
set steam_webApiKey "${STEAM_API_KEY}"
sets tags "argentina, qbcore, rol serio, produccion"
load_server_icon myLogo.png
sv_enforceGameBuild 3258
set resources_useSystemChat true

## ==================
## BASE DE DATOS (desde .env)
## ==================
set mysql_connection_string "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?charset=${MYSQL_CHARSET}"

# Voice config
setr voice_useNativeAudio "${USE_NATIVE_AUDIO}"
setr voice_useSendingRangeOnly "${VOICE_USE_SENDING_RANGE_ONLY}"
setr voice_defaultCycle "${VOICE_DEFAULT_CYCLE}"
setr voice_defaultVolume "${VOICE_DEFAULT_VOLUME}"
setr voice_enableRadioAnim 1
setr voice_syncData 1

# QBCore locale config
setr qb_locale "${QB_LOCALE}"

# QBCore UseTarget
setr UseTarget "${USE_TARGET}"

# These resources will start by default.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# QBCore & Extra stuff
ensure qb-core
ensure [qb]
ensure [standalone]
ensure [voice]
ensure [defaultmaps]

# Recursos customizados (agregar carpetas propias aquí)
# ensure [scripts-propios]
# ensure mapas/custom-map-1


## Permissions ##
add_ace group.admin command allow # allow all commands
add_principal identifier.fivem:16954360 group.admin #Fabian_Andres_Tullo

# Resources
add_ace resource.qb-core command allow # Allow qb-core to execute commands

# Gods
add_ace qbcore.god command allow # Allow all commands

# Inheritance
add_principal qbcore.god group.admin # Allow gods access to the main admin group used to get all default permissions
add_principal qbcore.god qbcore.admin # Allow gods access to admin commands
add_principal qbcore.admin qbcore.mod # Allow admins access to mod commands
