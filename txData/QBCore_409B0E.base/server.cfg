set mysql_connection_string "mysql://root:SFC21amorositopanda@127.0.0.1:3306/QBCore_409B0E?charset=utf8mb4"

# Voice config
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly false
setr voice_defaultCycle "GRAVE"
